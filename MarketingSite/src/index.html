<!DOCTYPE html>
<html>
    <head>
      <meta charset="UTF-8">
      <title>HealthShare</title>
    </head>

    <body>

      <input id="emailInput" type="email" placeholder="メール">
      <input id="passwordInput" type="password" placeholder="パスワード">
      <input id="nameInput" type="text" placeholder="名前">

      <button id="registerBtn" type="button">登録</button>
      <button id="loginBtn" type="button">ログイン</button>
      <button id="logoutBtn" type="button">ログアウト</button>

      <h1>HealthShareについて</h1>

        <h2>概要</h2>
            <p>
              HealthShareは、AppleWatchの心拍データをiPhoneで受信し、Firebaseを介してPC/スマホダッシュボードに共有する健康管理アプリです。
            </p>

        <h2>目的</h2>
        <ul>
            <li>
              高齢者などが家に一人でいる際に、その健康状態を常時チェックするため
            </li>
            <li>
              家族や友人、恋人との間での心拍共有を行うため
            </li>
        </ul>

      <script type="module" src="app.js"></script>

    </body>
</html>
